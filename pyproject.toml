[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "todo-mcp"
version = "0.1.0"
description = "Self-hosted remote MCP server for Microsoft To Do (Microsoft Graph v1.0)"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "bcrypt==5.0.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
test = ["pytest>=9", "pytest-asyncio>=1.3"]

[project.scripts]
todo-mcp = "todo_mcp.server:main"
todo-mcp-admin = "todo_mcp.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
